name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]  # This will trigger on tags starting with 'v'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 關鍵修正 1：賦予這個 Job 建立和寫入 Release 的權限
    permissions:
      contents: write

    env:
      # build.sh 每次都會 rm -rf ./openwrt，所以下載目錄必須放在樹外才快取得到；
      # 放在樹內的 openwrt/dl 每次建置都會一起被砍掉。
      OPENWRT_DL_DIR: ${{ github.workspace }}/dl

    steps:
    # ubuntu-latest 開局大約只剩 14 GB，全量 OpenWrt 建置剛好卡在臨界點上。
    # 只刪 runner 預裝、這個建置用不到的東西；hostedtoolcache 要留著，python 靠它。
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/share/boost /usr/share/swift
        sudo apt-get clean
        df -h /

    - name: Checkout repository
      uses: actions/checkout@v4

    # 快取的是樹外的 dl/，所以不會被 build.sh 的 rm -rf ./openwrt 影響。
    # key 帶 run_id 代表每次都會寫回一份新的；restore-keys 則保證接得上上一份。
    - name: Restore package downloads
      uses: actions/cache@v4
      with:
        path: dl
        key: openwrt-dl-${{ hashFiles('build.sh') }}-${{ github.run_id }}
        restore-keys: |
          openwrt-dl-${{ hashFiles('build.sh') }}-

    # 關鍵修正 4：明確安裝 OpenWrt 編譯相依套件，不要依賴 runner 映像剛好內建
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

    - name: Make build.sh executable
      run: chmod +x ./build.sh

    - name: Run build script
      run: ./build.sh

    - name: Check if output files exist
      id: check_files
      run: |
        FILES=(
          "./openwrt/bin/targets/econet/en751221/openwrt-econet-en751221-cmhk_gs2210-squashfs-tclinux.trx"
        )
        ALL_EXIST=true
        for FILE in "${FILES[@]}"; do
          if [ -f "$FILE" ]; then
            echo "$FILE exists"
            sha256sum "$FILE"
          else
            echo "$FILE does not exist"
            ALL_EXIST=false
          fi
        done
        if [ "$ALL_EXIST" = "true" ]; then
          echo "All files exist"
          echo "files_exist=true" >> $GITHUB_OUTPUT
        else
          echo "One or more files missing"
          echo "files_exist=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Create Release and Upload Assets
      # 簡化判斷邏輯：只要檔案存在，且是由 push tag 或手動觸發/推送到 main 就執行
      if: steps.check_files.outputs.files_exist == 'true'
      uses: softprops/action-gh-release@v2
      with:
        # 關鍵修正 2：如果不是用 tag 觸發（例如手動觸發），就自動產生一個臨時 tag
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_id) }}
        name: ${{ github.ref_type == 'tag' && github.ref_name || format('Manual Build {0}', github.run_number) }}
        draft: false
        prerelease: false
        files: |
          ./openwrt/bin/targets/econet/en751221/openwrt-econet-en751221-cmhk_gs2210-squashfs-tclinux.trx
      env:
        # 關鍵修正 3：改用系統內建的專用 Token
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
